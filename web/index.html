    <title>NIKKE 资料库</title>
    <meta name="description" content="NIKKE（胜利女神：妮姬）中文资料库：312 名角色的立绘与技能、528,256 条剧情台词全文检索、1,768 张 CG 图鉴，数据来自客户端本地解包。" />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('nikke-theme'); } catch (e) {}
        var q = new URLSearchParams(location.search).get('theme');
        if (q === 'light' || q === 'dark') t = q;
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
